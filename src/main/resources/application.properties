spring.application.name=sistema-chamados-manutencao
spring.datasource.url=jdbc:h2:mem:chamados
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.thymeleaf.cache=false

# Conta administrativa inicial (substitua por variáveis de ambiente em produção)
app.admin.name=${ADMIN_NAME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@chamados.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
server.port=${PORT:8080}
